<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockPulse</title>
    <meta name="description" content="Real-time AI stock analysis, top 20 recommended market watchlist, and persistent portfolio tracking with technical indicators, anchored VWAP, and cost basis analytics." />
    <meta property="og:title" content="StockPulse" />
    <meta property="og:description" content="Real-time AI stock analysis, top 20 recommended market watchlist, and persistent portfolio tracking with technical indicators, anchored VWAP, and cost basis analytics." />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
